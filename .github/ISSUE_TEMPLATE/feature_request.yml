name: Feature Request
description: Request a new package skill, domain, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new skill or improvement? Let us know!
  - type: dropdown
    id: type
    attributes:
      label: Request Type
      options:
        - New package skill
        - New domain / sub-skill
        - Improvement to existing skill
        - New reference guide
        - Other
    validations:
      required: true
  - type: input
    id: package-name
    attributes:
      label: Package Name
      description: If requesting a new package skill, which package?
      placeholder: "e.g., polars, gt, targets"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what you would like added or improved.
      placeholder: Describe your request...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this help your R workflow?
    validations:
      required: false
